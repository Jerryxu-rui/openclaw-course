<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenClaw完整课程体系 - 高级宣传演示</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap');
        
        :root {
            --primary-gradient: linear-gradient(135deg, #667EEA 0%, #764BA2 100%);
            --dark-bg: linear-gradient(135deg, #050508 0%, #0a0a1a 50%, #0d1528 100%);
            --light-text: #FFFFFF;
            --medium-text: #CBD5E0;
            --accent-color: #667EEA;
            --accent-gold: #FFD700;
            --shadow-color: rgba(0, 0, 0, 0.3);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--dark-bg);
            color: var(--light-text);
            overflow: hidden;
            height: 100vh;
            position: relative;
        }
        
        /* 加载屏幕 */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--dark-bg);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.5s ease;
        }
        
        .loading-logo {
            font-size: 3rem;
            font-weight: 900;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        
        .loading-bar {
            width: 300px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
            margin-top: 20px;
        }
        
        .loading-progress {
            width: 0%;
            height: 100%;
            background: var(--primary-gradient);
            border-radius: 2px;
            transition: width 0.3s ease;
        }
        
        /* 主容器 */
        .presentation-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            display: none;
        }
        
        /* 幻灯片 */
        .slide {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            padding: 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transform: translateX(100px) scale(0.95);
            transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 1;
        }
        
        .slide.active {
            opacity: 1;
            transform: translateX(0) scale(1);
            z-index: 2;
        }
        
        .slide.prev {
            transform: translateX(-100px) scale(0.95);
            opacity: 0;
        }
        
        /* 幻灯片内容 */
        .slide-content {
            max-width: 1200px;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .slide-header {
            margin-bottom: 60px;
        }
        
        .slide-title {
            font-size: 4.5rem;
            font-weight: 900;
            line-height: 1.2;
            margin-bottom: 20px;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .slide-subtitle {
            font-size: 2rem;
            font-weight: 400;
            color: var(--medium-text);
            line-height: 1.4;
        }
        
        .slide-body {
            font-size: 1.6rem;
            line-height: 1.8;
            color: var(--medium-text);
        }
        
        /* 列表样式 */
        .feature-list {
            list-style: none;
            padding-left: 0;
        }
        
        .feature-item {
            margin-bottom: 25px;
            padding-left: 40px;
            position: relative;
            font-size: 1.5rem;
        }
        
        .feature-item:before {
            content: '✓';
            position: absolute;
            left: 0;
            color: var(--accent-gold);
            font-size: 1.8rem;
            font-weight: bold;
        }
        
        /* 卡片网格 */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-top: 40px;
        }
        
        .card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 30px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        
        .card:hover {
            transform: translateY(-10px);
            border-color: var(--accent-color);
            box-shadow: 0 20px 40px var(--shadow-color);
        }
        
        .card-title {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 15px;
            color: var(--light-text);
        }
        
        .card-content {
            font-size: 1.2rem;
            color: var(--medium-text);
            line-height: 1.6;
        }
        
        /* 按钮 */
        .cta-button {
            background: var(--primary-gradient);
            color: white;
            border: none;
            padding: 20px 60px;
            font-size: 1.5rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 40px;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }
        
        .cta-button:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.5);
        }
        
        .cta-button:active {
            transform: translateY(0);
        }
        
        /* 导航控制 */
        .nav-controls {
            position: fixed;
            bottom: 40px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            gap: 30px;
        }
        
        .nav-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 28px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        
        .nav-btn:hover {
            background: var(--accent-color);
            border-color: var(--accent-color);
            transform: scale(1.1);
        }
        
        .progress-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .progress-bar {
            width: 200px;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
        }
        
        .progress-fill {
            width: 10%;
            height: 100%;
            background: var(--primary-gradient);
            border-radius: 3px;
            transition: width 0.3s ease;
        }
        
        .progress-text {
            color: var(--medium-text);
            font-size: 1.1rem;
            font-weight: 500;
            min-width: 80px;
        }
        
        /* 粒子背景 */
        .particles-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--accent-color);
            border-radius: 50%;
            animation: float 20s infinite linear;
            opacity: 0.6;
        }
        
        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.8;
            }
            90% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(-100vh) rotate(720deg);
                opacity: 0;
            }
        }
        
        /* 响应式设计 */
        @media (max-width: 1200px) {
            .slide {
                padding: 60px;
            }
            
            .slide-title {
                font-size: 3.5rem;
            }
            
            .slide-subtitle {
                font-size: 1.8rem;
            }
        }
        
        @media (max-width: 768px) {
            .slide {
                padding: 40px 20px;
            }
            
            .slide-title {
                font-size: 2.8rem;
            }
            
            .slide-subtitle {
                font-size: 1.5rem;
            }
            
            .slide-body {
                font-size: 1.3rem;
            }
            
            .card-grid {
                grid-template-columns: 1fr;
            }
            
            .nav-controls {
                bottom: 20px;
            }
            
            .nav-btn {
                width: 50px;
                height: 50px;
                font-size: 24px;
            }
            
            .progress-bar {
                width: 150px;
            }
        }
        
        @media (max-width: 480px) {
            .slide {
                padding: 30px 15px;
            }
            
            .slide-title {
                font-size: 2.2rem;
            }
            
            .slide-subtitle {
                font-size: 1.3rem;
            }
            
            .feature-item {
                font-size: 1.2rem;
            }
            
            .nav-controls {
                bottom: 15px;
                gap: 20px;
            }
            
            .progress-bar {
                width: 120px;
            }
        }
        
        /* 打印样式 */
        @media print {
            body {
                background: white !important;
                color: black !important;
            }
            
            .loading-screen,
            .nav-controls,
            .particles-container {
                display: none !important;
            }
            
            .presentation-container {
                display: block !important;
            }
            
            .slide {
                display: block !important;
                opacity: 1 !important;
                transform: none !important;
                position: relative !important;
                page-break-after: always;
                background: white !important;
                color: black !important;
                padding: 50px !important;
            }
            
            .slide-title {
                background: none !important;
                -webkit-text-fill-color: black !important;
                color: black !important;
            }
            
            .slide-subtitle,
            .slide-body {
                color: #333 !important;
            }
            
            .card {
                background: #f5f5f5 !important;
                border: 1px solid #ddd !important;
            }
        }
    </style>
</head>

        // 全局变量
        let currentSlideIndex = 0;
        let isLoading = true;
        
        // 初始化演示文稿
        function initPresentation() {
            // 模拟加载进度
            simulateLoading();
            
            // 创建粒子背景
            createParticles();
            
            // 创建幻灯片
            createSlides();
            
            // 设置事件监听器
            setupEventListeners();
            
            // 显示第一张幻灯片
            setTimeout(() => {
                showSlide(0);
                isLoading = false;
            }, 1500);
        }
        
        // 模拟加载进度
        function simulateLoading() {
            const progressBar = document.getElementById('loadingProgress');
            const loadingText = document.getElementById('loadingText');
            const texts = [
                '正在加载高级宣传演示文稿...',
                '初始化粒子系统...',
                '创建幻灯片内容...',
                '准备交互功能...',
                '即将完成...'
            ];
            
            let progress = 0;
            const interval = setInterval(() => {
                progress += 5;
                progressBar.style.width = `${progress}%`;
                
                // 更新加载文本
                const textIndex = Math.floor(progress / 20);
                if (textIndex < texts.length) {
                    loadingText.textContent = texts[textIndex];
                }
                
                if (progress >= 100) {
                    clearInterval(interval);
                    
                    // 隐藏加载屏幕
                    setTimeout(() => {
                        const loadingScreen = document.getElementById('loadingScreen');
                        loadingScreen.style.opacity = '0';
                        setTimeout(() => {
                            loadingScreen.style.display = 'none';
                            document.getElementById('presentationContainer').style.display = 'block';
                        }, 500);
                    }, 300);
                }
            }, 50);
        }
        
        // 创建粒子背景
        function createParticles() {
            const container = document.getElementById('particlesContainer');
            const particleCount = 80;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                
                // 随机位置
                particle.style.left = `${Math.random() * 100}%`;
                particle.style.top = `${Math.random() * 100}%`;
                
                // 随机大小
                const size = 2 + Math.random() * 6;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                
                // 随机动画
                const duration = 15 + Math.random() * 20;
                const delay = Math.random() * 20;
                particle.style.animationDuration = `${duration}s`;
                particle.style.animationDelay = `${delay}s`;
                
                // 随机颜色
                const hue = 220 + Math.random() * 60;
                particle.style.background = `hsla(${hue}, 80%, 65%, ${0.3 + Math.random() * 0.4})`;
                
                container.appendChild(particle);
            }
        }
        
        // 创建幻灯片
        function createSlides() {
            const container = document.getElementById('presentationContainer');
            
            slides.forEach((slide, index) => {
                const slideElement = document.createElement('div');
                slideElement.className = 'slide';
                slideElement.id = `slide-${index}`;
                slideElement.dataset.index = index;
                
                let slideContent = '';
                
                switch(slide.type) {
                    case 'cover':
                        slideContent = `
                            <div class="slide-content">
                                <div class="slide-header">

                            </div>
                        `;

                        slideContent = `

                                    <h1 class="slide-title">${slide.title}</h1>
                                    <h2 class="slide-subtitle">${slide.subtitle}</h2>
                                </div>

                                    </div>
                                </div>
                            </div>
                        `;
                        break;
                        
                    default:
                        slideContent = `

                                    <h2 class="slide-subtitle">${slide.subtitle}</h2>
                                </div>
                                <div class="slide-body">

                                        <ul class="feature-list">

                                        </ul>
                                    ` : ''}
                                    
                                    ${slide.type === 'outline' || slide.type === 'curriculum' ? `
                                        <div class="card-grid" style="margin-top: 40px;">
                                            <div class="card">
                                                <h3 class="card-title">基础阶段</h3>
                                                <p class="card-content">4课，掌握OpenClaw核心概念和基础操作</p>
                                            </div>
                                            <div class="card">
                                                <h3 class="card-title">进阶阶段</h3>
                                                <p class="card-content">5课，深入学习高级功能和优化技巧</p>
                                            </div>
                                            <div class="card">
                                                <h3 class="card-title">高级阶段</h3>
                                                <p class="card-content">3课，掌握企业级部署和团队协作</p>
                                            </div>
                                            <div class="card">
                                                <h3 class="card-title">实战阶段</h3>
                                                <p class="card-content">2课，完成金融实战项目开发</p>
                                            </div>
                                        </div>
                                    ` : ''}
                                </div>
                            </div>
                        `;
                }
                
                slideElement.innerHTML = slideContent;
                container.appendChild(slideElement);
            });
        }
        
        // 设置事件监听器
        function setupEventListeners() {
            // 导航按钮
            document.getElementById('prevBtn').addEventListener('click', prevSlide);
            document.getElementById('nextBtn').addEventListener('click', nextSlide);
            
            // 键盘导航
            document.addEventListener('keydown', (e) => {
                if (isLoading) return;
                
                switch(e.key) {
                    case 'ArrowLeft':
                    case 'PageUp':
                        prevSlide();
                        break;
                    case 'ArrowRight':
                    case 'PageDown':
                    case ' ':
                        nextSlide();
                        break;
                    case 'Home':
                        showSlide(0);
                        break;
                    case 'End':
                        showSlide(slides.length - 1);
                        break;
                    case 'f':
                    case 'F':
                        if (e.ctrlKey) toggleFullscreen();
                        break;
                    case 'Escape':
                        exitFullscreen();
                        break;
                    case 'p':
                    case 'P':
                        if (e.ctrlKey) window.print();
                        break;
                }
            });
            
            // 触摸滑动
            let touchStartX = 0;
            let touchStartY = 0;
            
            document.addEventListener('touchstart', (e) => {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
            });
            
            document.addEventListener('touchend', (e) => {
                const touchEndX = e.changedTouches[0].clientX;
                const touchEndY = e.changedTouches[0].clientY;
                
                const diffX = touchStartX - touchEndX;
                const diffY = touchStartY - touchEndY;
                
                // 只处理水平滑动，且垂直滑动距离较小
                if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 50) {
                    if (diffX > 0) {
                        nextSlide();
                    } else {
                        prevSlide();
                    }
                }
            });
            
            // 鼠标滚轮
            let wheelTimeout;
            document.addEventListener('wheel', (e) => {
                if (isLoading) return;
                
                clearTimeout(wheelTimeout);
                wheelTimeout = setTimeout(() => {
                    if (e.deltaY > 0) {
                        nextSlide();
                    } else if (e.deltaY < 0) {
                        prevSlide();
                    }
                }, 100);
            }, { passive: true });
        }
        
        // 显示指定幻灯片
        function showSlide(index) {
            if (index < 0 || index >= slides.length || isLoading) return;
            
            // 隐藏当前幻灯片
            const currentSlide = document.querySelector('.slide.active');
            if (currentSlide) {
                currentSlide.classList.remove('active');
                currentSlide.classList.add('prev');
                
                // 移除prev类，为下一次动画做准备
                setTimeout(() => {
                    currentSlide.classList.remove('prev');
                }, 800);
            }
            
            // 显示新幻灯片
            const newSlide = document.getElementById(`slide-${index}`);
            if (newSlide) {
                newSlide.classList.add('active');
                currentSlideIndex = index;
                
                // 更新进度指示器
                updateProgress();
                
                // 更新URL哈希
                window.location.hash = `slide-${index + 1}`;
            }
        }
        
        // 滚动到指定幻灯片（用于封面按钮）
        function scrollToSlide(index) {
            showSlide(index);
        }
        
        // 下一张幻灯片
        function nextSlide() {
            if (currentSlideIndex < slides.length - 1) {
                showSlide(currentSlideIndex + 1);
            }
        }
        
        // 上一张幻灯片
        function prevSlide() {
            if (currentSlideIndex > 0) {
                showSlide(currentSlideIndex - 1);
            }
        }
        
        // 更新进度指示器
        function updateProgress() {
            const progress = ((currentSlideIndex + 1) / slides.length) * 100;
            const progressFill = document.getElementById('progressFill');
            const progressText = document.getElementById('progressText');
            
            if (progressFill) {
                progressFill.style.width = `${progress}%`;
            }
            
            if (progressText) {
                progressText.textContent = `${currentSlideIndex + 1} / ${slides.length}`;
            }
        }
        
        // 全屏控制
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`全屏请求失败: ${err.message}`);
                });
            } else {
                exitFullscreen();
            }
        }
        
        function exitFullscreen() {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        }
        
        // 处理URL哈希
        function handleHashChange() {
            const hash = window.location.hash;
            if (hash) {
                const match = hash.match(/slide-(\d+)/);
                if (match) {
                    const slideNum = parseInt(match[1]) - 1;
                    if (slideNum >= 0 && slideNum < slides.length) {
                        showSlide(slideNum);
                    }
                }
            }
        }
        
        // 页面加载完成后初始化
        window.addEventListener('DOMContentLoaded', initPresentation);
        window.addEventListener('hashchange', handleHashChange);
        
        // 初始处理哈希
        setTimeout(handleHashChange, 100);
    </script>
</body>
