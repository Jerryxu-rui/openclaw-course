<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenClaw完整课程体系 - 宣传演示文稿</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #050508 0%, #0a0a1a 50%, #0d1528 100%);
            color: #fff;
            overflow: hidden;
            height: 100vh;
            position: relative;
        }
        
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #050508 0%, #0a0a1a 50%, #0d1528 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #667EEA;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        
        .loading-text {
            font-size: 18px;
            color: #A0AEC0;
            font-weight: 500;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .slides-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            display: none;
        }
        
        .slide {
            width: 100%;
            height: 100%;
            display: none;
            padding: 60px 80px;
            position: absolute;
            top: 0;
            left: 0;
            overflow: hidden;
            opacity: 0;
            transform: translateX(100px) scale(0.95);
            transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        .slide.active {
            display: flex;
            flex-direction: column;
            opacity: 1;
            transform: translateX(0) scale(1);
        }
        
        /* 导航控制 */
        .nav-controls {
            position: fixed;
            bottom: 40px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            gap: 20px;
        }
        
        .nav-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 24px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        
        .nav-btn:hover {
            background: rgba(102, 126, 234, 0.8);
            border-color: #667EEA;
            transform: scale(1.1);
        }
        
        .nav-btn:active {
            transform: scale(0.95);
        }
        
        .progress-indicator {
            color: #A0AEC0;
            font-size: 16px;
            font-weight: 500;
            min-width: 80px;
            text-align: center;
        }
        
        /* 粒子背景 */
        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }
        
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(102, 126, 234, 0.6);
            border-radius: 50%;
            animation: float 15s infinite;
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.8);
        }
        
        @keyframes float {
            0%, 100% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) rotate(720deg);
                opacity: 0;
            }
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .slide {
                padding: 40px 20px;
            }
            
            .nav-controls {
                bottom: 20px;
            }
            
            .nav-btn {
                width: 40px;
                height: 40px;
                font-size: 20px;
            }
        }
        
        @media (max-width: 480px) {
            .slide {
                padding: 30px 15px;
            }
            
            .nav-controls {
                bottom: 15px;
                gap: 15px;
            }
        }
    </style>
</head>
<body>
    <!-- 加载屏幕 -->
    <div class="loading-screen" id="loadingScreen">
        <div class="loading-spinner"></div>
        <div class="loading-text">正在加载OpenClaw课程演示文稿...</div>
    </div>
    
    <!-- 幻灯片容器 -->
    <div class="slides-container" id="slidesContainer">
        <!-- 幻灯片将通过JavaScript动态生成 -->
    </div>
    
    <!-- 导航控制 -->
    <div class="nav-controls">
        <button class="nav-btn" id="prevBtn">←</button>
        <div class="progress-indicator" id="progressIndicator">1 / 10</div>
        <button class="nav-btn" id="nextBtn">→</button>
    </div>
    
    <!-- 粒子背景 -->
    <div class="particles" id="particlesContainer"></div>
    
    <script>
        // 幻灯片数据
        const slidesData = [
            {
                id: 1,
                title: "OpenClaw完整课程体系",
                subtitle: "从零到一，打造你的专属AI助手生态",
                type: "cover",
                content: "国内首个系统性OpenClaw课程，实战经验全分享"
            },
            {
                id: 2,
                title: "为什么需要这个课程？",
                subtitle: "解决OpenClaw学习中的核心痛点",
                type: "problem",
                content: "安装配置复杂、成本控制困难、实战案例缺乏、生产部署困难"
            },
            {
                id: 3,
                title: "课程核心亮点",
                subtitle: "四大特色，直击需求",
                type: "features",
                content: [
                    "国内首个系统性OpenClaw课程",
                    "实战导向，生产级部署方案",
                    "金融实战案例：智能体金融+股票分析",
                    "成本优化专家，节省90%+ API费用"
                ]
            },
            {
                id: 4,
                title: "课程大纲",
                subtitle: "15课系统教学，4个阶段",
                type: "outline",
                content: [
                    "第一阶段：基础入门（4课）",
                    "第二阶段：进阶应用（5课）",
                    "第三阶段：高级进阶（3课）",
                    "第四阶段：实战项目（2课）"
                ]
            },
            {
                id: 5,
                title: "金融实战双案例",
                subtitle: "AI+金融的完美结合",
                type: "finance",
                content: [
                    "案例1：智能体金融 - Polymarket预测市场交易",
                    "案例2：智能股票分析 - A股/港股/美股投资分析",
                    "技术面+基本面结合，打造专业分析系统"
                ]
            },
            {
                id: 6,
                title: "目标学员",
                subtitle: "适合谁学习？",
                type: "audience",
                content: [
                    "开发者：想掌握AI Agent开发技术",
                    "产品经理：想用AI自动化工作流程",
                    "投资者：想学习AI在金融领域的应用",
                    "AI从业者：想深入OpenClaw生态"
                ]
            },
            {
                id: 7,
                title: "学习成果",
                subtitle: "学完后你能做什么？",
                type: "outcomes",
                content: [
                    "从零开始部署和配置OpenClaw",
                    "构建自动化工作流，提升10倍工作效率",
                    "开发金融分析系统，应用于实际投资",
                    "掌握成本优化技巧，节省90%+ AI使用成本",
                    "部署生产级OpenClaw实例，支持团队协作"
                ]
            },
            {
                id: 8,
                title: "定价策略",
                subtitle: "限时优惠，立即行动",
                type: "pricing",
                content: [
                    "完整课程包：¥899（原价¥999）",
                    "早鸟价：¥699（节省¥200）",
                    "团购价：3人以上¥599/人",
                    "优惠截止：2026年3月31日"
                ]
            },
            {
                id: 9,
                title: "立即报名",
                subtitle: "开启你的AI助手之旅",
                type: "cta",
                content: "扫描二维码或点击链接立即报名，加入学员交流群"
            },
            {
                id: 10,
                title: "联系我们",
                subtitle: "有任何问题？",
                type: "contact",
                content: [
                    "邮箱：contact@openclaw-course.com",
                    "微信：OpenClaw-Course",
                    "GitHub：github.com/Jerryxu-rui/openclaw-course",
                    "学员交流群：扫码加入"
                ]
            }
        ];
        
        // 当前幻灯片索引
        let currentSlideIndex = 0;
        
        // 初始化函数
        function initPresentation() {
            createParticles();
            createSlides();
            showSlide(0);
            
            // 隐藏加载屏幕
            setTimeout(() => {
                document.getElementById('loadingScreen').style.opacity = '0';
                document.getElementById('slidesContainer').style.display = 'block';
                setTimeout(() => {
                    document.getElementById('loadingScreen').style.display = 'none';
                }, 500);
            }, 1000);
            
            // 添加事件监听器
            document.getElementById('prevBtn').addEventListener('click', prevSlide);
            document.getElementById('nextBtn').addEventListener('click', nextSlide);
            
            // 键盘导航
            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowLeft') prevSlide();
                if (e.key === 'ArrowRight') nextSlide();
                if (e.key === 'Escape') exitFullscreen();
                if (e.key === 'F11') toggleFullscreen();
                if (e.key === 'p' || e.key === 'P') window.print();
            });
            
            // 触摸滑动
            let touchStartX = 0;
            let touchEndX = 0;
            
            document.addEventListener('touchstart', (e) => {
                touchStartX = e.changedTouches[0].screenX;
            });
            
            document.addEventListener('touchend', (e) => {
                touchEndX = e.changedTouches[0].screenX;
                handleSwipe();
            });
        }
        
        // 创建粒子背景
        function createParticles() {
            const container = document.getElementById('particlesContainer');
            const particleCount = 50;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                
                // 随机位置
                particle.style.left = `${Math.random() * 100}%`;
                particle.style.top = `${Math.random() * 100}%`;
                
                // 随机大小
                const size = 2 + Math.random() * 4;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                
                // 随机动画延迟
                particle.style.animationDelay = `${Math.random() * 15}s`;
                
                // 随机颜色
                const hue = 220 + Math.random() * 40;
                particle.style.background = `hsla(${hue}, 80%, 65%, 0.6)`;
                particle.style.boxShadow = `0 0 10px hsla(${hue}, 80%, 65%, 0.8)`;
                
                container.appendChild(particle);
            }
        }
        
        // 创建幻灯片
        function createSlides() {
            const container = document.getElementById('slidesContainer');
            
            slidesData.forEach((slide, index) => {
                const slideElement = document.createElement('div');
                slideElement.className = 'slide';
                slideElement.id = `slide-${index}`;
                
                // 根据幻灯片类型设置不同的内容
                let slideContent = '';
                
                switch(slide.type) {
                    case 'cover':
                        slideContent = `
                            <div style="text-align: center; margin-top: 20vh;">
                                <h1 style="font-size: 4rem; font-weight: 900; margin-bottom: 20px; background: linear-gradient(135deg, #667EEA 0%, #764BA2 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">${slide.title}</h1>
                                <h2 style="font-size: 2rem; font-weight: 400; color: #A0AEC0; margin-bottom: 40px;">${slide.subtitle}</h2>
                                <p style="font-size: 1.5rem; color: #CBD5E0; max-width: 800px; margin: 0 auto; line-height: 1.6;">${slide.content}</p>
                            </div>
                        `;
                        break;
                        
                    case 'problem':
                    case 'features':
                    case 'outline':
                    case 'finance':
                    case 'audience':
                    case 'outcomes':
                    case 'pricing':
                    case 'contact':
                        slideContent = `
                            <div style="max-width: 900px; margin: 0 auto;">
                                <h1 style="font-size: 3.5rem; font-weight: 800; margin-bottom: 20px; color: #fff;">${slide.title}</h1>
                                <h2 style="font-size: 1.8rem; font-weight: 400; color: #667EEA; margin-bottom: 40px;">${slide.subtitle}</h2>
                                <div style="font-size: 1.4rem; line-height: 1.8; color: #CBD5E0;">
                                    ${Array.isArray(slide.content) 
                                        ? `<ul style="list-style: none; padding-left: 0;">${slide.content.map(item => `<li style="margin-bottom: 15px; padding-left: 30px; position: relative;">✓ ${item}</li>`).join('')}</ul>`
                                        : `<p>${slide.content}</p>`
                                    }
                                </div>
                            </div>
                        `;
                        break;
                        
                    case 'cta':
                        slideContent = `
                            <div style="text-align: center; margin-top: 25vh;">
                                <h1 style="font-size: 4rem; font-weight: 900; margin-bottom: 20px; color: #fff;">${slide.title}</h1>
                                <h2 style="font-size: 2rem; font-weight: 400; color: #667EEA; margin-bottom: 40px;">${slide.subtitle}</h2>
                                <p style="font-size: 1.5rem; color: #CBD5E0; margin-bottom: 50px; max-width: 600px; margin-left: auto; margin-right: auto;">${slide.content}</p>
                                <button style="background: linear-gradient(135deg, #667EEA 0%, #764BA2 100%); color: white; border: none; padding: 20px 50px; font-size: 1.3rem; border-radius: 50px; cursor: pointer; font-weight: 600; transition: transform 0.3s ease;">立即报名</button>
                            </div>
                        `;
                        break;
                }
                
                slideElement.innerHTML = slideContent;
                container.appendChild(slideElement);
            });
        }
        
        // 显示幻灯片
        function showSlide(index) {
            // 隐藏所有幻灯片
            document.querySelectorAll('.slide').forEach(slide => {
                slide.classList.remove('active');
            });
            
            // 显示当前幻灯片
            const currentSlide = document.getElementById(`slide-${index}`);
            if (currentSlide) {
                currentSlide.classList.add('active');
                currentSlideIndex = index;
                
                // 更新进度指示器
                updateProgressIndicator();
                
                // 更新URL哈希（可选）
                window.location.hash = `slide-${index + 1}`;
            }
        }
        
        // 下一张幻灯片
        function nextSlide() {
            if (currentSlideIndex < slidesData.length - 1) {
                showSlide(currentSlideIndex + 1);
            }
        }
        
        // 上一张幻灯片
        function prevSlide() {
            if (currentSlideIndex > 0) {
                showSlide(currentSlideIndex - 1);
            }
        }
        
        // 更新进度指示器
        function updateProgressIndicator() {
            const indicator = document.getElementById('progressIndicator');
            if (indicator) {
                indicator.textContent = `${currentSlideIndex + 1} / ${slidesData.length}`;
            }
        }
        
        // 全屏控制
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`全屏请求失败: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }
        
        function exitFullscreen() {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        }
        
        // 处理触摸滑动
        function handleSwipe() {
            const swipeThreshold = 50;
            const diff = touchStartX - touchEndX;
            
            if (Math.abs(diff) > swipeThreshold) {
                if (diff > 0) {
                    // 向左滑动，下一张
                    nextSlide();
                } else {
                    // 向右滑动，上一张
                    prevSlide();
                }
            }
        }
        
        // 页面加载完成后初始化
        window.addEventListener('DOMContentLoaded', initPresentation);
        
        // 打印样式
        const style = document.createElement('style');
        style.textContent = `
            @media print {
                body {
                    background: white !important;
                    color: black !important;
                }
                
                .loading-screen,
                .nav-controls,
                .particles {
                    display: none !important;
                }
                
                .slides-container {
                    display: block !important;
                }
                
                .slide {
                    display: block !important;
                    opacity: 1 !important;
                    transform: none !important;
                    position: relative !important;
                    page-break-after: always;
                    background: white !important;
                    color: black !important;
                }
                
                .slide.active {
                    display: block !important;
                }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
